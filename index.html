<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Small_Project</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">   
</head>
<body>
        <div class="box">
            <button class="btn-R">Register</button>
            <button class="btn-L">Login</button>
            <div class="registration-box">
            <h1>Registration</h1>
            <form action="" method="post">
                <input type="text" placeholder="Username" required>
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <input type="submit" value="Register">
            </form>
            <p>or login with social platforms</p>
            <div class="media-icons">
                <a class="f" href="#"><i class="fab fa-facebook-f"></i></a>
                <a class="l" href="#"><i class="fab fa-linkedin-in"></i></a>
                <a class="g" href="#"><i class="fab fa-google"></i></a>
                <a class="gh" href="#"><i class="fab fa-github"></i></a>
            </div>
            </div>
            <div class="login-box">
            <h1>Login</h1>
            <form action="" method="post">
                <input type="text" placeholder="Username" required>
                <input type="password" placeholder="Password" required>
                <span><a href="#">Forgot Password?</a></span>
                <input type="submit" value="Login">
            </form>
            
            <p>or login with social platforms</p>
            <div class="media-icons">
                <a class="f" href="#"><i class="fab fa-facebook-f"></i></a>
                <a class="l" href="#"><i class="fab fa-linkedin-in"></i></a>
                <a class="g" href="#"><i class="fab fa-google"></i></a>
                <a class="gh" href="#"><i class="fab fa-github"></i></a>
            </div>
            </div>

            <div class="wel-login">
            <h2>Hello, Welcome!</h2>
            <p>Don't have an account?</p>
            <button class="btn-1">Register</button>
            </div>
            <div class="wel-registration">
            <h2>Welcome Back!</h2>
            <p>Already have an account?</p>
            <button class="btn-2">Login</button>
            </div>
        </div>
    <script src="main.js"></script>
</body>
</html>
